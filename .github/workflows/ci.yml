name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Source checks
        run: make check

  macos-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build ad-hoc signed Universal DMG
        env:
          VERSION: 0.0.0-ci
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package.sh
      - name: Verify bundle architecture and signature
        run: |
          lipo -info "dist/PrismArt.app/Contents/MacOS/PrismArt"
          lipo -info "dist/PrismArt.app/Contents/Resources/bin/primitive"
          codesign --verify --deep --strict --verbose=2 "dist/PrismArt.app"
          # The checksum file contains the DMG basename, so verify it from
          # the directory that contains both artifacts.
          (
            cd dist
            shasum -a 256 -c PrismArt-0.0.0-ci.dmg.sha256
          )
      - uses: actions/upload-artifact@v4
        with:
          name: PrismArt-macOS-ad-hoc
          path: |
            dist/PrismArt-*.dmg
            dist/PrismArt-*.dmg.sha256

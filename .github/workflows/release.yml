name: Release macOS + Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example: 1.0.1)'
        required: true
        default: '1.0.1'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 2
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building PrismArt $TAG"

      - name: Source checks
        run: make check

      - name: Build ad-hoc signed Universal DMG
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package.sh

      - name: Verify release artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/PrismArt.app"
          # The checksum file contains the DMG basename, so verify it from
          # the directory that contains both artifacts.
          (
            cd dist
            shasum -a 256 -c "PrismArt-$VERSION.dmg.sha256"
          )
          hdiutil verify "dist/PrismArt-$VERSION.dmg"
          lipo -info "dist/PrismArt.app/Contents/MacOS/PrismArt"
          lipo -info "dist/PrismArt.app/Contents/Resources/bin/primitive"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismArt-${{ steps.release.outputs.version }}-macOS
          path: |
            dist/PrismArt-${{ steps.release.outputs.version }}.dmg
            dist/PrismArt-${{ steps.release.outputs.version }}.dmg.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          ## PrismArt for macOS and Windows

          The macOS DMG supports Apple Silicon and Intel. The Windows x64 ZIP includes a self-contained app and the Primitive engine. End users do not need Go, Xcode, or .NET installed.

          **Gatekeeper:** this build is ad-hoc signed because the project does not use a paid Apple Developer ID. macOS may block the first launch. After attempting to open PrismArt, use **System Settings → Privacy & Security → Open Anyway** only if you trust this repository and the downloaded checksum matches.
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/replacing assets."
            gh release upload "$TAG" \
              "dist/PrismArt-$VERSION.dmg" \
              "dist/PrismArt-$VERSION.dmg.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "dist/PrismArt-$VERSION.dmg" \
              "dist/PrismArt-$VERSION.dmg.sha256" \
              --target "$GITHUB_SHA" \
              --title "PrismArt $TAG" \
              --notes-file /tmp/release-notes.md
          fi

  windows:
    needs: release
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify Windows package
        shell: pwsh
        run: |
          $zip = "dist/PrismArt-$env:VERSION-Windows-x64.zip"
          $expected = (Get-Content "$zip.sha256" -Raw).Split(' ')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Windows ZIP checksum mismatch.' }
          if (-not (Test-Path 'dist/windows/PrismArt.exe')) { throw 'PrismArt.exe missing.' }
          if (-not (Test-Path 'dist/windows/primitive.exe')) { throw 'primitive.exe missing.' }
      - uses: actions/upload-artifact@v4
        with:
          name: PrismArt-${{ needs.release.outputs.version }}-Windows-x64
          path: |
            dist/PrismArt-${{ needs.release.outputs.version }}-Windows-x64.zip
            dist/PrismArt-${{ needs.release.outputs.version }}-Windows-x64.zip.sha256
      - name: Add Windows assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG "dist/PrismArt-$env:VERSION-Windows-x64.zip" "dist/PrismArt-$env:VERSION-Windows-x64.zip.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows release assets.' }
